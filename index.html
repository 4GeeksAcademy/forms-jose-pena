<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container-fluid p-5">
    <div class="row">
      <div class="col">
        <!-- This column will make the card approximately 1/3 of the container width on medium screens and larger -->
        <div class="card">
          <div class="card text-center">
            <div class="card-header text-start">
              <h1>Form Payment example</h1>
            </div>
            <div class="card-body">
              <div class="alert alert-danger" role="alert">
                A simple danger alert—check it out!
              </div>
              <div class="row text-start">

                <div class="col-5 mb-3 ">
                  <label for="formGroupExampleInput" class="form-label">Card#</label>
                  <input type="text" class="form-control" id="formGroupExampleInput" placeholder="xxxxxxxxxxxxxxxxxxxx">
                </div>
                <div class="col-3 mb-3 ">
                  <label for="cvc" class="form-label">cvc#</label>
                  <input type="text" class="form-control" id="cvc" placeholder="000000000">
                </div>
                <div class="col-4 mb-3">
                  <label for="Amount" class="form-label">Amount</label>
                  <input type="text" class="form-control" id="Amount" placeholder="Amount">
                </div>
              </div>


              <div class="row text-start ">
                <div class="col-md-6">
                  <label for="inputEmail4" class="form-label">Email</label>
                  <input type="email" class="form-control" id="inputEmail4">
                </div>
                <div class="col-md-6">
                  <label for="Password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="Password">
                </div>
              </div>
              <div class="row text-start">
                <div class="col-6 mb-3">
                  <label for="city" class="form-label">City</label>
                  <input type="Name" class="form-control" id="city">
                </div>
                <div class="col-2 mb-3">
                  <label for="state" class="form-label">State</label>
                  <select id="state" class="form-select">
                    <option selected disabled>Select a state</option>
                    <option value="CA">California</option>
                    <option value="NY">New York</option>
                    <option value="TX">Texas</option>
                  </select>
                </div>
                <div class="col-4 mb-3">
                  <label for="Postal code" class="form-label">Postal code</label>
                  <input type="postal code" class="form-control" id="Postal code">
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 text-start ">
                  <div class="col-md-4 bg-secondary d-flex ">
                    <div class="m-2">
                      <input class="form-check-input" type="checkbox" value="" id="mastercard">
                      <label class="form-check-label" for="mastercard">
                        <i class="fa-brands fa-cc-mastercard"></i>
                      </label>
                    </div>
                    <div class="m-2">
                      <input class="form-check-input" type="checkbox" value="" id="paypal">
                      <label class="form-check-label" for="paypal">
                        <i class="fa-brands fa-cc-mastercard"></i>
                      </label>
                    </div>
                    <div class="m-2">
                      <input class="form-check-input" type="checkbox" value="" id="debit">
                      <label class="form-check-label" for="debit">
                        <i class="fa-brands fa-cc-mastercard"></i>
                      </label>
                    </div>
                    <div class="m-2">
                      <input class="form-check-input" type="checkbox" value="" id="americanexpress">
                      <label class="form-check-label" for="americanexpress">
                        <i class="fa-brands fa-cc-mastercard"></i>
                      </label>
                    </div>
                  </div>
                </div>



                <div class="col mb-3 text-start">
                  <label for="message-text" class="col-form-label">Message:</label>
                  <textarea class="form-control" id="message-text"></textarea>
                  <figure>
                    <blockquote class="blockquote">

                    </blockquote>
                    <figcaption class="blockquote-footer">
                      Add notes here <cite title="Source Title"></cite>
                    </figcaption>
                  </figure>
                </div>



                <div class="card-footer text-end text-body-secondary">
                  <button type="button" class="btn btn-secondary">Cancel</button>
                  <button type="button" class="btn btn-primary">Send</button>

                </div>
              </div>



              <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>
</body>

</html>
